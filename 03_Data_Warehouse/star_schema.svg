<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
 <rect width="1000" height="760" fill="#ffffff"/>
 <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">
 Amazon Reviews 2023 — Beauty &amp; Personal Care
 </text>
 <text x="500" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">Star Schema — grain: 1 row = 1 review</text>
 <text x="500" y="70" text-anchor="middle" font-size="12" fill="#57606a">3.66M รีวิว · 999K สินค้า · 2.92M ผู้รีวิว · ปี 2000–2023</text>
 <!-- ============ dim_date (top) ============ -->
 <g>
 <rect x="395" y="80" width="210" height="150" rx="7" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
 <rect x="395" y="80" width="210" height="28" rx="7" fill="#2da44e"/>
 <rect x="395" y="98" width="210" height="10" fill="#2da44e"/>
 <text x="500" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">dim_date</text>
 <text x="408" y="126" font-size="12" fill="#1f2328" font-weight="700">date_key (PK)</text>
 <text x="408" y="145" font-size="12" fill="#1f2328">full_date</text>
 <text x="408" y="164" font-size="12" fill="#1f2328">year · quarter · month</text>
 <text x="408" y="183" font-size="12" fill="#1f2328">month_name · week_of_year</text>
 <text x="408" y="202" font-size="12" fill="#1f2328">day_of_week · day_name</text>
 <text x="408" y="221" font-size="12" fill="#1f2328">is_weekend</text>
 </g>
 <!-- ============ dim_product (left) ============ -->
 <g>
 <rect x="40" y="330" width="235" height="205" rx="7" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
 <rect x="40" y="330" width="235" height="28" rx="7" fill="#2da44e"/>
 <rect x="40" y="348" width="235" height="10" fill="#2da44e"/>
 <text x="157" y="349" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">dim_product</text>
 <text x="53" y="376" font-size="12" fill="#1f2328" font-weight="700">product_key (PK)</text>
 <text x="53" y="395" font-size="12" fill="#1f2328">parent_asin</text>
 <text x="53" y="414" font-size="12" fill="#1f2328">product_title</text>
 <text x="53" y="433" font-size="12" fill="#1f2328">main_category</text>
 <text x="53" y="452" font-size="12" fill="#1f2328">store (brand)</text>
 <text x="53" y="471" font-size="12" fill="#1f2328">price · price_band</text>
 <text x="53" y="490" font-size="12" fill="#1f2328">listed_avg_rating</text>
 <text x="53" y="509" font-size="12" fill="#1f2328">listed_rating_count</text>
 <text x="53" y="528" font-size="12" fill="#1f2328">category · has_metadata</text>
 </g>
 <!-- ============ dim_user (right) ============ -->
 <g>
 <rect x="725" y="330" width="235" height="205" rx="7" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
 <rect x="725" y="330" width="235" height="28" rx="7" fill="#2da44e"/>
 <rect x="725" y="348" width="235" height="10" fill="#2da44e"/>
 <text x="842" y="349" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">dim_user</text>
 <text x="738" y="376" font-size="12" fill="#1f2328" font-weight="700">user_key (PK)</text>
 <text x="738" y="395" font-size="12" fill="#1f2328">user_id</text>
 <text x="738" y="414" font-size="12" fill="#1f2328">lifetime_reviews</text>
 <text x="738" y="433" font-size="12" fill="#1f2328">categories_reviewed</text>
 <text x="738" y="452" font-size="12" fill="#1f2328">avg_rating_given</text>
 <text x="738" y="471" font-size="12" fill="#1f2328">total_helpful_votes</text>
 <text x="738" y="490" font-size="12" fill="#1f2328">verified_share</text>
 <text x="738" y="509" font-size="12" fill="#1f2328">first / last_review_date</text>
 <text x="738" y="528" font-size="12" fill="#1f2328">reviewer_segment</text>
 </g>
 <!-- ============ fact_review (center) ============ -->
 <g>
 <rect x="368" y="300" width="264" height="265" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="2.2"/>
 <rect x="368" y="300" width="264" height="28" rx="7" fill="#0969da"/>
 <rect x="368" y="318" width="264" height="10" fill="#0969da"/>
 <text x="500" y="319" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">fact_review</text>
 <text x="381" y="346" font-size="12" fill="#1f2328" font-weight="700">review_id (PK)</text>
 <text x="381" y="365" font-size="12" fill="#6639ba" font-style="italic">date_key (FK)</text>
 <text x="381" y="384" font-size="12" fill="#6639ba" font-style="italic">product_key (FK)</text>
 <text x="381" y="403" font-size="12" fill="#6639ba" font-style="italic">user_key (FK)</text>
 <text x="381" y="422" font-size="12" fill="#8a6d00">category (degenerate dim)</text>
 <line x1="381" y1="432" x2="619" y2="432" stroke="#0969da" stroke-width="0.8" stroke-dasharray="3,3"/>
 <text x="381" y="451" font-size="12" fill="#1f2328">rating</text>
 <text x="381" y="470" font-size="12" fill="#1f2328">helpful_vote</text>
 <text x="381" y="489" font-size="12" fill="#1f2328">verified_purchase</text>
 <text x="381" y="508" font-size="12" fill="#1f2328">has_images</text>
 <text x="381" y="527" font-size="12" fill="#1f2328">is_positive · is_negative</text>
 <text x="381" y="546" font-size="12" fill="#1f2328">review_ts</text>
 </g>
 <!-- ============ review_text (bottom) ============ -->
 <g>
 <rect x="380" y="630" width="240" height="110" rx="7" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
 <rect x="380" y="630" width="240" height="28" rx="7" fill="#bc4c00"/>
 <rect x="380" y="648" width="240" height="10" fill="#bc4c00"/>
 <text x="500" y="649" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">review_text</text>
 <text x="393" y="676" font-size="12" fill="#1f2328" font-weight="700">review_id (PK, FK)</text>
 <text x="393" y="695" font-size="12" fill="#1f2328">category · parent_asin · rating</text>
 <text x="393" y="714" font-size="12" fill="#1f2328">review_title (raw)</text>
 <text x="393" y="733" font-size="12" fill="#1f2328">review_text (raw)</text>
 </g>
 <!-- ============ edges ============ -->
 <!-- dim_date -> fact (one-to-many) -->
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 500 230 L 500 300"/>
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 492 288 L 500 300 L 508 288"/>
 <line stroke="#57606a" stroke-width="1.6" fill="none" x1="490" y1="243" x2="510" y2="243"/>
 <text x="510" y="270" font-size="11" fill="#57606a">date_key</text>
 <!-- dim_product -> fact -->
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 275 432 L 368 432"/>
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 356 424 L 368 432 L 356 440"/>
 <line stroke="#57606a" stroke-width="1.6" fill="none" x1="290" y1="422" x2="290" y2="442"/>
 <text x="300" y="424" font-size="11" fill="#57606a">product_key</text>
 <!-- dim_user -> fact -->
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 725 432 L 632 432"/>
 <path stroke="#57606a" stroke-width="1.6" fill="none" d="M 644 424 L 632 432 L 644 440"/>
 <line stroke="#57606a" stroke-width="1.6" fill="none" x1="710" y1="422" x2="710" y2="442"/>
 <text x="632" y="424" font-size="11" fill="#57606a">user_key</text>
 <!-- fact -> review_text (1:1, dashed) -->
 <path stroke="#57606a" stroke-width="1.6" fill="none" stroke-dasharray="6,4" d="M 500 565 L 500 630"/>
 <line stroke="#57606a" stroke-width="1.6" fill="none" x1="490" y1="578" x2="510" y2="578"/>
 <line stroke="#57606a" stroke-width="1.6" fill="none" x1="490" y1="617" x2="510" y2="617"/>
 <text x="510" y="601" font-size="11" fill="#57606a">review_id (1:1)</text>
 <!-- ============ notes ============ -->
 <g>
 <rect x="678" y="80" width="292" height="150" rx="7" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
 <text x="692" y="102" font-size="11.5" fill="#4a4a4a" font-weight="700">ทำไมแยก review_text ออกมา</text>
 <text x="692" y="122" font-size="11.5" fill="#4a4a4a">ข้อความรีวิวกินพื้นที่มากกว่าคอลัมน์อื่นรวมกัน</text>
 <text x="692" y="139" font-size="11.5" fill="#4a4a4a">แยกออกแล้ว fact table เล็กพอโหลดเข้า</text>
 <text x="692" y="156" font-size="11.5" fill="#4a4a4a">pandas บนโน้ตบุ๊กได้ (join ด้วย review_id)</text>
 <text x="692" y="181" font-size="11.5" fill="#4a4a4a" font-weight="700">ทำไม category ซ้ำอยู่ใน fact</text>
 <text x="692" y="201" font-size="11.5" fill="#4a4a4a">ใช้เป็น partition key ตอน export Parquet</text>
 <text x="692" y="218" font-size="11.5" fill="#4a4a4a">ผู้ใช้จึงอ่านทีละหมวดได้โดยไม่สแกนทั้งชุด</text>
 </g>
 <g>
 <rect x="30" y="600" width="300" height="140" rx="7" fill="#f3e8ff" stroke="#8250df" stroke-width="1.2"/>
 <text x="44" y="622" font-size="11.5" fill="#4a4a4a" font-weight="700">Stage 2 (preprocessing) อ่านจาก schema นี้</text>
 <text x="44" y="642" font-size="11.5" fill="#4a4a4a">แล้วสร้าง dataset ชุดที่สอง:</text>
 <text x="44" y="664" font-size="11.5" fill="#4a4a4a">• reviews — ข้อความสะอาด + feature + label</text>
 <text x="44" y="681" font-size="11.5" fill="#4a4a4a"> + train/val/test split ตามเวลา</text>
 <text x="44" y="703" font-size="11.5" fill="#4a4a4a">• product_features — 1 แถว = 1 สินค้า</text>
 <text x="44" y="720" font-size="11.5" fill="#4a4a4a"> พร้อมสถิติสำหรับจัดอันดับ/หาสินค้าขาลง</text>
 </g>
</svg>
